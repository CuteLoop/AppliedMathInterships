name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate site
        run: |
          mkdir -p site
          # Copy data files to site
          cp -r data/* site/ 2>/dev/null || echo "No data files to copy"
          # Create index.html
          echo '<html><head><title>Applied Math Internships</title></head>' > site/index.html
          echo '<body><h1>Applied Math Internships</h1>' >> site/index.html
          echo '<p>Latest scraped internship data:</p><ul>' >> site/index.html
          for file in data/*_latest.json; do
            if [ -f "$file" ]; then
              basename="${file##*/}"
              echo "<li><a href='$basename'>$basename</a></li>" >> site/index.html
            fi
          done
          echo '</ul></body></html>' >> site/index.html
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
